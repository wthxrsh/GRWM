spring:
  datasource:
    url: jdbc:h2:mem:grwm;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.hibernate.SQL: WARN

grwm:
  jwt:
    secret: dev-only-secret-key-that-is-long-enough-for-hs256-signing-2026